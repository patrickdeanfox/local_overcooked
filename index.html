<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Overcooked</title>
    <style>
      /* Self-hosted OFL fonts (public/fonts, licences beside them): a chunky display face for
         headings and numbers, a rounded body face for menus and the HUD. BootScene waits for
         them before any text is measured. */
      @font-face {
        font-family: 'Titan One';
        src: url('/fonts/TitanOne-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'Fredoka';
        src: url('/fonts/Fredoka-Variable.ttf') format('truetype');
        font-weight: 300 700;
        font-display: swap;
      }
      html, body { margin: 0; padding: 0; background: #0f2b30; height: 100%; overflow: hidden; }
      #game { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: auto; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
